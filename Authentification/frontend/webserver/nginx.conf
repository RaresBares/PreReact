events {}
http {
  include /etc/nginx/mime.types;
server {
    listen 8102;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    location /auth/ {
        # strip the /auth prefix so requests map to files under /var/www/html
                rewrite ^/auth/?(.*)$ /$1 last;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
            rewrite ^/auth/?(.*)$ /$1 last;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
            rewrite ^/auth/?(.*)$ /$1 last;
        try_files $uri =404;
        include fastcgi.conf;
        fastcgi_pass authentification-php:8104;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
}