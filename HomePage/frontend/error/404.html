  <title>404 – Seite verloren</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .animate-float {
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    .stars {
      background: radial-gradient(#444 1px, transparent 1px);
      background-size: 20px 20px;
    }
  </style>
</head>
<body class="bg-black text-white h-screen flex items-center justify-center flex-col stars relative overflow-hidden">

  <!-- Ufo -->
  <div class="animate-float relative z-10">
    <img src="../error/ufo.png" alt="UFO" class="w-40 mx-auto opacity-80" />
  </div>

  <!-- 404 Text -->
  <h1 class="text-6xl font-bold mt-8 z-10">404 – Seite im All verloren</h1>
  <p class="text-gray-400 mt-4 z-10">Diese Seite existiert nicht (mehr) – vielleicht wurde sie entführt 🛸</p>

  <a href="/" class="mt-8 inline-block bg-white text-black px-6 py-3 rounded-full hover:bg-gray-300 transition-all duration-300 z-10">Zurück zur Erde</a>

<div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-60 opacity-70 pointer-events-none z-0">
<img src="../error/planet.png" alt="Erde"
     class="w-[1500px] mt-64 mx-auto" />
</div>




</body>
</html>
