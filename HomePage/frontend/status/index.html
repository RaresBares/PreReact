<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Moderne ERP-Lösungen für das Gesundheitswesen – flexibel, sicher und webbasiert.">
<meta property="og:title" content="PreReact – Digitale Verwaltung für den medizinischen Alltag">
<meta property="og:description" content="PreReact bietet intelligente Softwarelösungen für Terminvergabe, Rechnungsstellung und Lagerverwaltung im Gesundheitsbereich.">
<meta property="og:url" content="https://www.prereact.ch">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.prereact.ch/assets/icon.png">
<link rel="shortcut icon" href="/assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/icon.png">

  <title>Systemstatus – Prereact</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    canvas#netCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body class="bg-black text-white overflow-x-hidden">
<div id="navbar"></div>
<script>
    fetch("../navbar.html")
        .then(res => res.text())
        .then(html => {
            document.getElementById("navbar").innerHTML = html;
        });
</script>

  <canvas id="netCanvas"></canvas>

  <main class="relative z-10 px-6 pt-40 pb-28 min-h-screen">
    <h1 class="text-4xl md:text-5xl font-bold text-center mb-4 fade-in">Systemstatus</h1>
    <p class="text-center text-gray-400 text-lg max-w-xl mx-auto mb-12 fade-in">
      Live-Statusanzeige unserer Systeme. Alle Systeme werden automatisch überwacht.
    </p>
    <div id="status-container" class="max-w-4xl mx-auto space-y-8"></div>
  </main>

  <footer class="text-center py-6 text-gray-500 bg-black relative z-10">
    &copy; 2025 Prereact – Systemstatus
  </footer>

  <script>
    // Netzwerk-Hintergrund
    const canvas = document.getElementById('netCanvas'), ctx = canvas.getContext('2d');
    let w, h, points = [];
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      points = [];
      for (let i = 0; i < 100; i++) {
        points.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4
        });
      }
    }
    window.addEventListener('resize', resize); resize();
    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < points.length; i++) {
        let p = points[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = '#aaa';
        ctx.fill();
        for (let j = i + 1; j < points.length; j++) {
          let q = points[j], dx = p.x - q.x, dy = p.y - q.y;
          let dist = Math.hypot(dx, dy);
          if (dist < 100) {
            ctx.strokeStyle = `rgba(255,255,255,${1 - dist / 100})`;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
          }
        }
      }
      requestAnimationFrame(draw);
    }
    draw();

    // Sichtbarkeitsanimation
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1 });

    // Farbcode je Status
    function getColor(code) {
      return {
        1: "rgba(34,197,94,1)",     // grün
        2: "rgba(234,179,8,1)",     // gelb
        3: "rgba(239,68,68,1)",     // rot
        4: "rgba(59,130,246,1)"     // blau (Wartung)
      }[code] || "rgba(239,68,68,1)";
    }

    const STATUS_MAP = {
      1: { text: "Betriebsbereit" },
      2: { text: "Teilweise Störung" },
      3: { text: "Nicht verfügbar / Wartung" },
      4: { text: "Wartung" }
    };

    // Lade JSON-Statusdatei
    fetch("status.json")
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("status-container");
        Object.entries(data).forEach(([name, statusCode]) => {
          const { text } = STATUS_MAP[statusCode] || STATUS_MAP[3];
          const color = getColor(statusCode);

          const box = document.createElement("div");
          box.className = "fade-in relative bg-white/5 border border-white/10 p-6 rounded-xl shadow-md overflow-hidden";
          box.innerHTML = `
            <div class="relative z-10">
              <h2 class="text-xl font-semibold">${name}</h2>
              <p class="text-sm text-gray-400 mt-1">Status: <span class="text-white">${text}</span></p>
            </div>
            <div class="absolute top-0 right-0 h-full w-1/2 z-0" style="background: linear-gradient(to right, transparent 0%, ${color} 100%); opacity: 0.4;"></div>
          `;
          container.appendChild(box);
          observer.observe(box);
        });
      });

    // Titel und Text oben direkt einblenden
    document.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible'));
  </script>
</body>
</html>
