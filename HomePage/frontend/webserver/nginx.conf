events {}
http {
  include /etc/nginx/mime.types;
server {
    listen 8202;
    server_name _;
    port_in_redirect off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ^~ /de/ {
  	rewrite ^/de/?(.*)$ /$1 last;
    }

}
}
