events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  gzip on;
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream auth_frontend           { server authentification-frontend:8102; }
  upstream authentification_api    { server authentification-backend:8101; }
  upstream storemate_api           { server storemate-backend:8001; }
  upstream storemate_frontend      { server storemate-frontend:8002; }
  upstream mainpage_frontend       { server mainpage-frontend:8202; }
  upstream timemate_api            { server timemate-backend:8301; }
  upstream timemate_frontend       { server timemate-frontend:8302; }

  server {
    listen 80;
    server_name _;

    # Auth frontend
    location = /auth { return 301 /auth/; }
    location /auth/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://auth_frontend/;
    }

    location = /api/auth { return 301 /api/auth/; }
    location /api/auth/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      rewrite ^/api/auth/?(.*)$ /$1 break;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_pass http://authentification_api;
    }

    # Storemate frontend
    location = /storemate { return 301 /storemate/; }
        location /storemate/ {
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_pass http://storemate_frontend;
        }

    location = /timemate { return 301 /timemate/; }
        location /timemate/ {
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_pass http://timemate_frontend;
        }

    location = /api/storemate { return 301 /api/storemate/; }
    location /api/storemate/ {
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;

          rewrite ^/api/storemate/?(.*)$ /$1 break;

          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;

          proxy_pass http://storemate_api;
        }

    location /api/timemate/ {
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;

          rewrite ^/api/timemate/?(.*)$ /$1 break;

          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;

          proxy_pass http://timemate_api;
        }

    # Default fallback → Mainpage
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      proxy_redirect ~^https?://[^/]+:8202(/.*)$ $scheme://$host$1;

      proxy_pass http://mainpage_frontend;
    }
  }
}