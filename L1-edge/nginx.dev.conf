events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  gzip on;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # WebSocket upgrade helper
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # --- Upstreams (Docker service names + ports) ---
  upstream auth_frontend { zone auth_frontend 64k; server authentification-frontend:8102 resolve; }
  upstream authentification_api { zone authentification_api 64k; server authentification-backend:8101 resolve; }
  upstream storemate_api { zone storemate_api 64k; server storemate-backend:8001 resolve; }
  upstream storemate_frontend { zone storemate_frontend 64k; server storemate-frontend:8002 resolve; }
  upstream mainpage_frontend { zone mainpage_frontend 64k; server mainpage-frontend:8202 resolve; }

  # ---- HTTP (80): reverse proxy (no SSL) ----
  server {
    listen 80;
    server_name _;

    # Let’s Encrypt HTTP-01 challenge (harmless to keep even without SSL)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }



    # Auth frontend under /auth
    location = /auth { return 301 /auth/; }
           location /auth/ {
                 proxy_set_header Host $host;
                 proxy_set_header X-Real-IP $remote_addr;
                 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                 proxy_set_header X-Forwarded-Proto $scheme;
                 proxy_pass http://auth_frontend;       # preserve /auth prefix
               }

           location = /api/auth { return 301 /api/auth/; }
           location /api/auth/ {
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
             proxy_set_header X-Forwarded-Host $host;

             # Strip the /api/auth prefix so /api/auth/docs -> /docs at backend
             rewrite ^/api/auth/?(.*)$ /$1 break;

             proxy_http_version 1.1;
             proxy_set_header Upgrade $http_upgrade;
             proxy_set_header Connection $connection_upgrade;

             proxy_pass http://authentification_api;
           }





            location = /storemate { return 301 /storemate/; }
                   location /storemate/ {
                         proxy_set_header Host $host;
                         proxy_set_header X-Real-IP $remote_addr;
                         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                         proxy_set_header X-Forwarded-Proto $scheme;
                         proxy_pass http://storemate_frontend;       # preserve /auth prefix
                       }

                   location = /api/storemate { return 301 /api/storemate/; }
                   location /api/storemate/ {
                     proxy_set_header Host $host;
                     proxy_set_header X-Real-IP $remote_addr;
                     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                     proxy_set_header X-Forwarded-Proto $scheme;
                     proxy_set_header X-Forwarded-Host $host;

                     # Strip the /api/auth prefix so /api/auth/docs -> /docs at backend
                     rewrite ^/api/storemate/?(.*)$ /$1 break;

                     proxy_http_version 1.1;
                     proxy_set_header Upgrade $http_upgrade;
                     proxy_set_header Connection $connection_upgrade;

                     proxy_pass http://storemate_api;
                   }



    # ---------- API routes (uncomment if needed) ----------
    # location /api/storemate/ { proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto http; proxy_pass http://storemate_api; }
    # location /api/auth/      { proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto http; proxy_pass http://auth_api; }

    # ---------- Default fallback ----------
    location / {
      # Forward original client details
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      # Rewrite absolute Location headers coming back from the upstream that include :8202
      # to the public host/port seen by the client.
      proxy_redirect ~^https?://[^/]+:8202(/.*)$ $scheme://$host$1;

      proxy_pass http://mainpage_frontend;  # send everything else to mainpage
    }
  }
}