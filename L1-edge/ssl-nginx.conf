

events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  gzip on;

  # Docker DNS for runtime resolving
  resolver 127.0.0.11 valid=10s ipv6=off;

  # WebSocket upgrade helper
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # --- Upstreams (Docker service names + ports) ---
  upstream auth_frontend { zone auth_frontend 64k; server authentification-frontend:8102 resolve; }
  upstream authentification_api { zone authentification_api 64k; server authentification-backend:8101 resolve; }
  upstream storemate_api { zone storemate_api 64k; server storemate-backend:8001 resolve; }
  upstream storemate_frontend { zone storemate_frontend 64k; server storemate-frontend:8002 resolve; }
  upstream mainpage_frontend { zone mainpage_frontend 64k; server mainpage-frontend:8202 resolve; }

  # ---- HTTP (80): ACME + redirect to HTTPS ----
  server {
    listen 80;
    server_name prereact.ch;  # TODO: replace with your domain(s)

    # Let’s Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Everything else -> HTTPS
    location / { return 301 https://$host$request_uri; }
  }

  # ---- HTTPS (443): reverse proxy with SSL ----
  server {
    listen 443 ssl http2;
    server_name example.com www.example.com;  # TODO: replace with your domain(s)

    # --- SSL certs from certbot (mount /etc/letsencrypt and /var/www/certbot) ---
    ssl_certificate     /etc/letsencrypt/live/prereact.ch/fullchain.pem;  # TODO: set domain
    ssl_certificate_key /etc/letsencrypt/live/prereact.ch/privkey.pem;    # TODO: set domain

    # Reasonable SSL defaults
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ACME challenge also over HTTPS (harmlos, manchmal hilfreich)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # ----------------- ROUTES -----------------

    # Auth frontend under /auth
    location = /auth { return 301 /auth/; }
    location /auth/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://auth_frontend;
    }

    # Auth API under /api/auth -> strip prefix
    location = /api/auth { return 301 /api/auth/; }
    location /api/auth/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      rewrite ^/api/auth/?(.*)$ /$1 break;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_pass http://authentification_api;
    }

    # Storemate frontend under /storemate
    location = /storemate { return 301 /storemate/; }
    location /storemate/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://storemate_frontend;  # preserve /storemate prefix
    }

    # Storemate API under /api/storemate -> strip prefix
    location = /api/storemate { return 301 /api/storemate/; }
    location /api/storemate/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      rewrite ^/api/storemate/?(.*)$ /$1 break;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_pass http://storemate_api;
    }

    # Default fallback -> mainpage
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      # Fix absolute redirects coming back with :8202
      proxy_redirect ~^https?://[^/]+:8202(/.*)$ $scheme://$host$1;

      proxy_pass http://mainpage_frontend;
    }
  }
}
