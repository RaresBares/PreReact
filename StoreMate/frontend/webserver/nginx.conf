events {}
http {
  include /etc/nginx/mime.types;

  server {
    listen 8002;
    server_name _;
    root /usr/share/nginx/html;

    location = /storemate { return 301 /storemate/; }

    location /storemate/ {
      try_files $uri $uri/ /storemate/index.html;
    }

    location ^~ /storemate/assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location ~ /\. { deny all; }
  }
}