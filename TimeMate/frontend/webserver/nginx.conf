events {}
http {
  include /etc/nginx/mime.types;

  server {
    listen 8302;
    server_name _;
    root /usr/share/nginx/html;

    location = /timemate { return 301 /timemate/; }

    location /timemate/ {
      try_files $uri $uri/ /timemate/index.html;
    }

    location ^~ /timemate/assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location ~ /\. { deny all; }
  }
}