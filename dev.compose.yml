services:
  auth_frontend:
    image: php:8.2-fpm-alpine
    volumes:
      - ./Authentification/frontend:/var/www/auth_frontend
    expose:
      - "9000"
  db_auth:
    image: postgres:16-alpine
    env_file:
      - ./environments/auth_db.env
    volumes:
      - auth_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auth} -d ${POSTGRES_DB:-authdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    restart: unless-stopped

  storemate_db:
    image: postgres:16-alpine
    env_file:
      - ./environments/storemate_db.env
    expose:
      - "5432"
    volumes:
      - storemate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d storemate"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth_backend:
    build:
      context: ./Authentification/backend
      dockerfile: Dockerfile
    env_file:
      - environments/authentification.env
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8081"]
    expose:
      - "8081"
    depends_on:
      db_auth:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./StoreMate/app
      dockerfile: StoreMate/backend/Dockerfile
    env_file:
      - ./environments/storemate.env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    volumes:
      - ./media:/code/media
    depends_on:
      auth_backend:
        condition: service_started
      storemate_db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./StoreMate/frontend-docker
      dockerfile: StoreMate/frontend/Dockerfile
    volumes:
      - ./StoreMate/frontend-docker/frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: /api
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    expose:
      - "5173"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
      - auth_backend
      - auth_frontend
    ports:
      - "80:80"
    volumes:
      - ./L1-edge/L1-edge.conf:/etc/L1-edge/L1-edge.conf:ro
      - ./Authentification/frontend:/var/www/auth_frontend:ro
      - "./ServicePanel:/usr/share/L1-edge/html:ro"              # Service-Panel mount
      - ./Homepage:/var/www/home:ro
    restart: unless-stopped
  main_frontend:
    image: php:8.2-fpm-alpine
    volumes:
      - ./Homepage:/var/www/home
    expose:
      - "9000"
    restart: unless-stopped
volumes:
  auth_pg: {}
  storemate_pg: {}